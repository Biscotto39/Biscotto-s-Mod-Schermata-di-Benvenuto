.github/workflows/update-addons.yml
name: Aggiorna addon Steam Workshop

on:
  workflow_dispatch:
  schedule:
    
cron: "17 /6 * *"

permissions:
  contents: write

jobs:
  update-addons:
    runs-on: ubuntu-latest

    steps:
      
name: Scarica repository
      uses: actions/checkout@v4

      
name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"

      
name: Leggi la collection Steam e aggiorna addons.json
      run: python scripts/update_addons.py

      
name: Salva eventuali modifiche
      run: |
        if git diff --quiet -- addons.json; then
          echo "Nessuna modifica agli addon."
          exit 0
        fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addons.json
          git commit -m "Aggiorna addon dalla collection Steam"
          git push
